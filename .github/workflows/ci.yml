name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs (tags can be moved; SHAs can't).
# Dependabot proposes updates and keeps the version comments in sync.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    # Fails the build if an API key or other credential is committed,
    # anywhere in history (fetch-depth: 0 scans every commit, not just HEAD).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Hash-checked install from the lockfile: CI tests exactly the
      # dependency versions that were reviewed.
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Unit tests
        run: python -m pytest
      # Retrieval-quality regression gate on the dependency-free backend.
      # No API calls: a change that hurts retrieval fails the build.
      - name: Retrieval eval (TF-IDF)
        run: python -m evals.retrieval_eval --backends tfidf --no-rerank --min-hit-at-3 0.85

  retrieval-eval-embeddings:
    # Same gate for local embeddings + cross-encoder reranking. CPU-only
    # PyTorch keeps the install small; Hugging Face models are cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          # Not hash-locked: CPU-only torch comes from PyTorch's own index,
          # which a single universal lockfile can't express cleanly.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "sentence-transformers>=3.0.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1
      - name: Retrieval eval (local embeddings, with and without reranking)
        run: python -m evals.retrieval_eval --backends local --min-hit-at-3 0.90
